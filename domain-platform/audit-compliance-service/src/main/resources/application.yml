server:
  port: 9138

grpc:
  server:
    port: 9038
    # Interceptors are auto-registered as Spring beans by TracingConfiguration.
    interceptors:
      - com.uber.doma.domain_platform.audit_compliance_service.tracing.GrpcServerTracingInterceptor

spring:
  application:
    name: audit-compliance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_compliance_service_db
    username: uber
    password: uber_password

# Each scatter-gather leg is bounded independently so one unavailable domain
# cannot hold the complete regulatory audit query open indefinitely.
audit:
  scatter-gather:
    downstream-timeout: 2s

# Micrometer Tracing + OpenTelemetry W3C context propagation configuration.
# See https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html#actuator.micrometer-tracing
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true

# OpenTelemetry SDK configuration: the bridge-otel auto-config picks up the
# OTEL_* style properties when present, and we explicitly disable any
# external exporter that might not be reachable in the local test environment.
otel:
  sdk:
    disabled: false
  traces:
    exporter: logging
  metrics:
    exporter: none
  logs:
    exporter: none
  service:
    name: audit-compliance-service

# Resilience4j: sliding-window circuit breaker that opens when the
# failure rate exceeds 50% over a 100-call window. The breaker protects
# downstream regulatory-reporting and audit-storage calls from cascading
# failures; the fallback methods return empty/degraded responses so the
# booking SLA is preserved even when the breaker is OPEN.
resilience4j:
  circuitbreaker:
    instances:
      auditStorage:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.uber.doma.domain_platform.audit_compliance_service.resilience.DownstreamUnavailableException
      regulatoryReport:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.uber.doma.domain_platform.audit_compliance_service.resilience.DownstreamUnavailableException
  bulkhead:
    instances:
      auditStorage:
        maxConcurrentCalls: 50
        maxWaitDuration: 100ms
  timelimiter:
    instances:
      auditStorage:
        timeoutDuration: 3s
        cancelRunningFuture: true
